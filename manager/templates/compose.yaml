services:
  app:
    image: "${ACHELIFE_APP_IMAGE}"
    restart: "${ACHELIFE_RESTART_POLICY:-unless-stopped}"
    init: true
    security_opt:
      - no-new-privileges:true
    environment: &app-environment
      APP_NAME: Achelife
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: "${ACHELIFE_APP_KEY}"
      APP_URL: "${ACHELIFE_URL}"
      ACHELIFE_VERSION: "${ACHELIFE_VERSION}"
      LOG_CHANNEL: stderr
      LOG_LEVEL: warning
      DB_CONNECTION: sqlite
      DB_DATABASE: /data/achelife.sqlite
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: sync
      FILESYSTEM_DISK: local
      RUN_MIGRATIONS: "true"
    volumes:
      - achelife-data:/data
      - achelife-storage:/var/www/html/storage
    networks:
      - achelife-internal
    healthcheck:
      test: ["CMD", "php", "artisan", "achelife:verify"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 30s

  scheduler:
    image: "${ACHELIFE_APP_IMAGE}"
    restart: "${ACHELIFE_RESTART_POLICY:-unless-stopped}"
    init: true
    security_opt:
      - no-new-privileges:true
    command: ["php", "artisan", "schedule:work"]
    environment:
      <<: *app-environment
      RUN_MIGRATIONS: "false"
    volumes:
      - achelife-data:/data
      - achelife-storage:/var/www/html/storage
    networks:
      - achelife-internal
    depends_on:
      app:
        condition: service_healthy

  web:
    image: "${ACHELIFE_WEB_IMAGE}"
    restart: "${ACHELIFE_RESTART_POLICY:-unless-stopped}"
    init: true
    security_opt:
      - no-new-privileges:true
    ports:
      - "${ACHELIFE_BIND_ADDRESS:-127.0.0.1}:${ACHELIFE_PORT:-8080}:80"
    networks:
      - achelife-internal
      - achelife-edge
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/up"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s

volumes:
  achelife-data:
    name: "${ACHELIFE_DATA_VOLUME}"
  achelife-storage:
    name: "${ACHELIFE_STORAGE_VOLUME}"

networks:
  achelife-internal:
    internal: true
  achelife-edge:
